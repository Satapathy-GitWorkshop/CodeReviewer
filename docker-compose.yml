version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crd-postgres
    environment:
      POSTGRES_DB: codereview
      POSTGRES_USER: ${DB_USERNAME:-crduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crdpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-crduser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: crd-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/codereview
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DB_USERNAME: ${DB_USERNAME:-crduser}
      DB_PASSWORD: ${DB_PASSWORD:-crdpass}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8080/api
    container_name: crd-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
